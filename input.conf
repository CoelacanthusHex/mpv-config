MBTN_LEFT     ignore
#MBTN_LEFT_DBL cycle fullscreen    # toggle fullscreen on/off
MBTN_RIGHT    cycle pause
#MBTN_BACK     playlist-prev
#MBTN_FORWARD  playlist-next

WHEEL_UP      add volume 2
WHEEL_DOWN    add volume -2
UP      add volume 2
DOWN    add volume -2

M script-binding manager-update-all                     #! Upgrade Plugins

# Anime4k-restore（速度快，无缩放，重建线条）
CTRL+1   change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Restore_CNN_M.glsl" #! Shaders > Anime4K > Anime4K 无缩放，重建线条
# Anime4k-GAN（速度快，两倍放大，感知略强）
CTRL+2   change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Upscale_GAN_x2_M.glsl" #! Shaders > Anime4K > Anime4k-GAN 两倍放大
# FSRCNNX8041（速度较慢，两倍放大，比较忠于原始画面）
CTRL+3   change-list glsl-shaders toggle "~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl" #! Shaders > FSRCNNX8041 两倍放大
# 自适应锐化（速度一般，无缩放）
CTRL+4   change-list glsl-shaders toggle "~~/shaders/igv/adaptive-sharpen.glsl" #! Shaders > 自适应锐化
# Anime4k的"DTDD"（速度较快，无缩放，加深线条+细化线条+中位降噪+高斯解糊，主观感知强）
CTRL+5   change-list glsl-shaders set "~~/shaders/Anime4K_Darken_HQ.glsl:~~/shaders/Anime4K_Thin_HQ.glsl:~~/shaders/Anime4K_Denoise_Bilateral_Mode.glsl:~~/shaders/Anime4K_Deblur_DoG.glsl" #! Shaders > Anime4K > Anime4k DTDD 无缩放，加深线条+细化线条+中位降噪+高斯解糊
# AMD_FSR（速度很快，放大到目标分辨率，伴随对比度自适应锐化）
Ctrl+6   change-list glsl-shaders toggle "~~/shaders/AMD_FSR.glsl" #! Shaders > AMD FSR 放大到目标分辨率，伴随对比度自适应锐化
# 双 SSIM（速度一般，辅助内建算法进行放大缩小）
CTRL+0   change-list glsl-shaders toggle "~~/shaders/igv/KrigBilateral.glsl:~~/shaders/SSimSuperRes.glsl:~~/shaders/SSimDownscaler.glsl" #! Shaders > 双 SSIM


@        vf toggle vapoursynth="~~/vs/mvtools-std.py"     #! Video Filter > mvtools 补帧

ESC set fullscreen no                  # leave fullscreen
