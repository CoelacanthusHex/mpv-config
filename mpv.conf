
###########
# General #
###########

save-position-on-quit

# Window size takes up to 85% of the screen
autofit-larger=90%x85%
# The window size should occupy at least 10% of the screen
#autofit-smaller=10%

# 高优先级
#priority=high

########
# 视频 #
########

# 指定要使用的视频输出后端。
vo=gpu-next,gpu,dmabuf-wayland
profile=gpu-hq

target-colorspace-hint

#hwdec=auto-copy
#hwdec=auto
hwdec=vaapi,vulkan,nvdec

gpu-api=vulkan
#vulkan-device='AMD Radeon Graphics (RADV RENOIR)'
#vulkan-device='NVIDIA GeForce RTX 3050 Laptop GPU (NVK GA107)'

vulkan-async-compute=yes
vulkan-async-transfer=yes

# may help with 4K videos
vd-lavc-dr=yes
opengl-pbo=yes

# "ReClock" replacement SVP补帧时推荐关闭
# 因为 Vulkan 的问题关闭
#video-sync=display-resample
video-sync=audio
interpolation=no

# Be explicit about a 10-bit output target. In gpu-next, dithering is tied to
# the output depth after rendering, not just the source file depth, so even a
# 10-bit source can still benefit on the final write to the swapchain.
dither-depth=10
temporal-dither
# 默认6。会稍微延缓mpv启动
dither-size-fruit=7
# Error diffusion costs more GPU work, but that tradeoff is justified here
# because the entire profile is tuned for output quality over minimum load.
#
# Kernel notes:
# - sierra-lite: mpv's documented default; fastest reasonable choice
# - floyd-steinberg: classic reference kernel
# - burkes: stronger quality/performance tradeoff than sierra-lite, but heavier
# - atkinson: different look, sometimes useful for screenshots or personal taste
#
# Larger kernels exist, but mpv's own documentation warns that many of them are
# disproportionately slower and heavier on shared memory. If future A/B testing
# is desired, floyd-steinberg and burkes are the most sensible alternatives.
dither=error-diffusion
error-diffusion=sierra-lite

# interpolation使用的算法。详见https://mpv.io/manual/master/#options-tscale
# 一些讨论见 https://github.com/mpv-player/mpv/issues/2685
# 目前的默认为mitchell。总体而言mitchell更平滑（当然不好和SVP插帧比），但会有模糊。oversample没有模糊，但不平滑（基本还原24帧的样子）
# 具体选择哪个请依据自身需求来
# SVP补帧时推荐关闭
tscale=oversample

# 放大算法，gpu-hq的默认为spline36
scale=ewa_lanczossharp
scale-antiring=0.6
# 色度升频算法
cscale=ewa_lanczossharp
cscale-antiring=0.6
# 缩小算法
dscale=mitchell

# 启用校色
icc-profile-auto
#icc-profile=~/.local/share/icc/rtings-icc-profile.icm
# 默认64x64x64。会稍微延缓mpv启动
icc-3dlut-size=256x256x256
target-colorspace-hint=auto

#############
# 脚本 滤镜 #
#############

#glsl-shaders-append="~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl"
#glsl-shaders-append="~~/shaders/igv/KrigBilateral.glsl"
#glsl-shaders-append="~~/shaders/igv/SSimSuperRes.glsl"
#linear-downscaling=no
#glsl-shaders-append="~~/shaders/igv/SSimDownscaler.glsl"
glsl-shaders-append="~~/shaders/Artoriuz/JointBilateral.glsl"
glsl-shaders-append="~~/shaders/Artoriuz/PixelClipper.glsl"

# MPV校色曲线目标是BT.1886，此视频滤镜用于回归常见的显示器标准 https://github.com/mpv-player/mpv/issues/8009
vf-append = format=gamma=gamma2.2

af-append=rubberband
#af-toggle=@loudnorm:lavfi=[loudnorm=I=-16:TP=-3:LRA=4]
af-toggle=@dynaudnorm:lavfi=[dynaudnorm=g=5:f=250:r=0.9:p=0.9]

########
# 功能 #
########

# 以暂停状态启动播放器
pause
# <N|inf|no> 始终循环播放当前文件
#loop=inf
# <N|inf|force|no>播放列表循环
#loop-playlist=no
# 播放完毕不退出
keep-open=yes
# 输出视频帧时请勿入睡。（开启后无法正确显示补帧数值）
#untimed
#log-file="~~desktop/mpv.log"


########
# 音频 #
########

#ao=pulse
ao=pipewire
#ao=jack
# 音频通道独占
#audio-exclusive=yes
# <默认no|exact|fuzzy|all> 自动加载同名外挂音轨
audio-file-auto=fuzzy
# <100.0-1000.0>
#volume-max=100
# 播放器启动音量，0为静音
#volume=100

# 如果双声道系统播放多声道影片时有的声道声音没出现，尝试强制设定为双声道
#audio-channels=stereo
# 规格化：
#audio-normalize-downmix=yes
# 多声道音轨downmix成双声道时，如果觉得背景音过响，角色台词声音小，尝试看看这个：https://github.com/mpv-player/mpv/issues/6563

# Specify default audio device. You can list devices with: --audio-device=help
# The option takes the device string (the stuff between the '...').
#audio-device=alsa/default

# Do not filter audio to keep pitch when changing playback speed.
#audio-pitch-correction=no

# Output 5.1 audio natively, and upmix/downmix audio with a different format.
#audio-channels=5.1
# Disable any automatic remix, _if_ the audio output accepts the audio format.
# of the currently played file. See caveats mentioned in the manpage.
# (The default is "auto-safe", see manpage.)
#audio-channels=auto

alang=zh-CN,zh-Hans,sc,chs,cht,tc,zh-Hant,zh-TW,zh-HK,zh,eng,en,jp,jpn

########
# 字幕 #
########

# 自动加载同名外挂字幕
sub-auto=fuzzy
sub-file-paths=subs
# 字幕首选语言为(简体)中文
slang=zh-CN,zh-Hans,sc,chs,cht,tc,zh-Hant,zh-TW,zh-HK,zh,eng,en,jp,jpn
# <yes|video|默认no> 在插值和/或颜色管理之前，将字幕直接混合到升级的视频帧上（默认值：否）。 启用此选项会导致字幕受--icc-profile，--target-prim，--target-trc，--interpolation，--gamma-factor和--glsl-shaders的影响。 使用--interpolation时，还可以提高字幕性能。启用此功能的缺点是将字幕限制在视频的可见部分，因此，字幕不能出现在视频下方的黑色空白处（例如）。如果选择了video，则行为类似于yes，但是以视频的原始分辨率绘制了子对象，并与视频一起缩放。
blend-subtitles=video
# 使字幕输出在黑边上
sub-ass-force-margins=yes
#sid=1
# 字幕显示出来和xy-subfilter不一样？尝试启用下面的设置
# 关乎字幕是否随视频拉伸
#sub-ass-vsfilter-aspect-compat=no
# 关乎字幕模糊的设定
#sub-ass-vsfilter-blur-compat=no
# 即使都用上了也不一致？那不是这两个选项的问题，重新注释掉这两行，回帖问吧。（多半是vsfilter/libass其中一个的bug）
# use default sans-serif font to use fallback function
#sub-font=方正悠宋 GBK 509R, 霞鹜文楷

########
# 截图 #
########

# <默认jpg|png|webp>
screenshot-format=webp
# 默认为7（0-9）
#screenshot-png-compression=7
# 设置在PNG压缩之前应用的过滤器。0为无，1为sub，2为up，3为average，4为Paeth，5为mixed，这会影响可以达到的压缩级别。对于大多数图像，mixed可实现最佳压缩率，因此它是默认设置。
#screenshot-png-filter=5
screenshot-webp-lossless=yes
screenshot-webp-quality=100
screenshot-webp-compression=4 # 默认为4<0-6>
#screenshot-jpeg-quality=100
#screenshot-jpeg-source-chroma=yes
# <0-15> JXL的视觉模型距离，0为质量无损，0.1为视觉无损，默认 1 相当于JPEG的90质量
# 0 is taking too long to screenshot
#screenshot-jxl-distance=0
# <1-9> JXL压缩等级，过高的等级影响性能，默认 3
#screenshot-jxl-effort=5
# 使用适当的色彩空间标记屏幕截图（并非所有格式受支持）默认no
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes
# s键保存路径截图在桌面
screenshot-directory=~/Pictures/Screenshots


#######
# OSD #
#######

osc = no
osd-bar = no
#osd-font="Material-Design-Iconic-Font"
#term-osd-bar=yes


##########
# Others #
##########

# Pretend to be a web browser. Might fix playback with some streaming sites,
# but also will break with shoutcast streams.
#user-agent="Mozilla/5.0"

# cache settings
#
# Use a large seekable RAM cache even for local input.
#cache=yes

cache=auto
# use max quality for HLS streams
hls-bitrate=max

#
# Use extra large RAM cache (needs cache=yes to make it useful).
#demuxer-max-bytes=500M
#demuxer-max-back-bytes=100M
#
# Disable the behavior that the player will pause if the cache goes below a
# certain fill size.
#cache-pause=no
#
# Store cache payload on the hard disk instead of in RAM. (This may negatively
# impact performance unless used for slow input such as network.)
#cache-on-disk=yes

# Display English subtitles if available.
#slang=en

# Play Finnish audio if available, fall back to English otherwise.
#alang=fi,en

# Change subtitle encoding. For Arabic subtitles use 'cp1256'.
# If the file seems to be valid UTF-8, prefer UTF-8.
# (You can add '+' in front of the codepage to force it.)
#sub-codepage=cp1256

#ytdl=yes
#ytdl-format=(bestvideo[ext=webm]/bestvideo[height>1080]/bestvideo[fps=60])[tbr<13000]+(bestaudio[acodec=opus]/bestaudio[ext=webm]/bestaudio[acodec=vorbis]/bestaudio[acodec=aac]/bestaudio)/best
#ytdl-format=((bestvideo[vcodec^=vp9]/bestvideo)+(bestaudio[acodec=opus]/bestaudio[acodec=vorbis]/bestaudio[acodec=aac]/bestaudio))/best
#ytdl-format="((bestvideo[height<=3840][vcodec^=vp9]/bestvideo[height<=3840])+(bestaudio[acodec=opus]/bestaudio[acodec=vorbis]/bestaudio[acodec=aac]/bestaudio))/best"
#ytdl-format=(bestvideo[height<=3840][vcodec=vp9]/bestvideo[height<=3840])+bestaudio
ytdl-format=bestvideo[height<=3840]+bestaudio/bestvideo[height<=3840]/bestaudio
#ytdl-raw-options-append=format-sort=vcodec,acodec,vext,aext
ytdl-raw-options-append=prefer-free-formats=
ytdl-raw-options-append=proxy=socks5://127.0.0.1:1089
msg-color=yes
msg-module=yes

############
# Profiles #
############

# The following profile can be enabled on the command line with: --profile=eye-cancer

[NoDeband]
profile-desc=YUV420P10及以上的源关闭去色带
profile-cond=p["video-params/average-bpp"]>=24
profile-restore=copy
deband=no

[bilibili]
profile-desc = Bilibili videos
profile-cond = path:match("https://www.bilibili.com")~=nil
profile-restore = copy
referrer = https://www.bilibili.com/
ytdl-raw-options = cookies-from-browser=firefox:coelacanthus

[HDR]
profile-desc=Enable HDR output policy for PQ or HLG sources
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy

# When the source is HDR, allow mpv to switch the output path into HDR-aware
# signaling instead of leaving the swapchain in a generic SDR state.
target-colorspace-hint=yes

# source-dynamic tells gpu-next to build output hints from source metadata and,
# when dynamic metadata exists, turn it into scene-varying HDR10-style luminance
# hints. This does not output native Dolby Vision or HDR10+, but it is the most
# useful experimental mode for a high-end Windows HDR chain that responds well
# to scene-varying HDR10-style output hints.
target-colorspace-hint-mode=source-dynamic

# Describe the intended HDR output target for this display chain. The panel is
# treated as PQ / BT.2020 container / P3-limited gamut with a practical 800 nit
# peak target rather than an unrealistic paper spec.
target-trc=pq
target-prim=bt.2020
target-gamut=dci-p3
target-peak=800
target-contrast=inf

# Keep the shared HDR behavior here and push metadata-specific decisions into
# the conditional profiles below. That separation prevents later profile
# application from accidentally undoing format-specific choices.
gamut-mapping-mode=perceptual
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30

# -------------------------------------------------------------------------------------------------
# HDR Metadata Precedence
# -------------------------------------------------------------------------------------------------

# This is the generic HDR fallback. It covers plain HDR10 or HLG, Dolby Vision
# profile 7 fallback, and unknown Dolby Vision profiles whenever HDR10+ scene
# metadata is not present.
[auto-hdr-generic]
profile-desc=Use computed scene analysis for HDR without HDR10+ and without supported DV metadata-specialized profiles
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and (get("video-params/scene-max-r", 0) <= 0) and (get("video-params/scene-max-g", 0) <= 0) and (get("video-params/scene-max-b", 0) <= 0) and (get("current-tracks/video/dolby-vision-profile", 0) ~= 5) and (get("current-tracks/video/dolby-vision-profile", 0) ~= 8) and (get("current-tracks/video/dolby-vision-profile", 0) ~= 9)
profile-restore=copy

# When there is no metadata-specific path worth trusting, computed peak analysis
# remains the most robust general-purpose HDR fallback.
hdr-compute-peak=yes

# For streaming-style single-layer Dolby Vision profiles, trust the Dolby
# Vision metadata path more than generic frame analysis. This block appears
# after the generic fallback so supported DV profiles override it cleanly.
[auto-dolby-vision-rpu]
profile-desc=Prefer Dolby Vision metadata path for profile 5 8 and 9 content
profile-cond=(get("current-tracks/video/dolby-vision-profile", 0) == 5) or (get("current-tracks/video/dolby-vision-profile", 0) == 8) or (get("current-tracks/video/dolby-vision-profile", 0) == 9)
profile-restore=copy

# Disable compute-peak here so mpv does not fight the DV-derived metadata path
# with a second, less specific scene-analysis policy.
hdr-compute-peak=no

# If HDR10+ scene metadata exists, prefer mpv's dedicated HDR10+ path. This is
# intentionally the last metadata-specialized block so HDR10+ wins if a file
# ever exposes both HDR10+ and Dolby Vision-compatible metadata.
[auto-hdr10plus]
profile-desc=Automatically prefer HDR10+ metadata when present
profile-cond=(get("video-params/scene-max-r", 0) > 0) or (get("video-params/scene-max-g", 0) > 0) or (get("video-params/scene-max-b", 0) > 0)
profile-restore=copy

# Use the HDR10+ tone-mapping path directly and avoid redundant compute-peak
# analysis when real HDR10+ scene metadata is available.
tone-mapping=st2094-40
hdr-compute-peak=no


